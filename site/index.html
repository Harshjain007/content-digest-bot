<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Register — everything the bot filed</title>
<meta name="description" content="A knowledge register of AI tools, papers and learning notes, filed automatically as they are found." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* A machine files these at 3am. The chrome is the console it runs in;
       the entries are sheets of paper it prints out. */
    --void:     #0E1017;
    --chrome:   #161A24;
    --chrome-2: #1D222E;
    --edge:     #29303F;
    --sheet:    #FCFBF8;
    --sheet-2:  #F2F0EA;

    --ink:      #14171E;
    --ink-soft: #5C6575;
    --dim:      #79839A;
    --bright:   #E8EBF2;

    --amber:    #F0A93B;
    --tool:     #F0A93B;
    --note:     #68B7D6;
    --learn:    #4FBF8B;
    --paper:    #8891F5;
    --doc:      #D97FC0;

    --display: "Bricolage Grotesque", "Helvetica Neue", system-ui, sans-serif;
    --body:    "Newsreader", Georgia, "Times New Roman", serif;
    --mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --spine: 6.5rem;
    --wrap: 64rem;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--bright);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ============================================================ console */
  .console {
    background: var(--chrome);
    border-bottom: 1px solid var(--edge);
    background-image:
      radial-gradient(120% 100% at 12% 0%, rgba(240,169,59,.10), transparent 62%);
  }
  .console-inner {
    max-width: var(--wrap);
    margin: 0 auto;
    padding: 2.75rem 1.5rem 1.5rem;
  }

  .status {
    display: flex;
    align-items: center;
    gap: .55rem;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 1.4rem;
  }
  .pulse {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--learn);
    box-shadow: 0 0 0 0 rgba(79,191,139,.55);
    flex: none;
  }
  .pulse.hit { animation: ping 1.1s ease-out 2; }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(79,191,139,.55); }
    100% { box-shadow: 0 0 0 11px rgba(79,191,139,0); }
  }
  .status .sep { color: var(--edge); }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 5.2rem);
    letter-spacing: -.045em;
    line-height: .9;
    margin: 0;
    color: var(--bright);
  }
  h1 em {
    font-style: normal;
    color: var(--amber);
  }
  .standfirst {
    margin: 1rem 0 0;
    max-width: 33rem;
    color: var(--dim);
    font-size: 1.02rem;
  }

  /* ---- the tally: what is actually in here, by kind ---- */
  .tally {
    display: flex;
    flex-wrap: wrap;
    gap: 1.4rem;
    margin: 1.9rem 0 0;
    padding: 0;
    list-style: none;
    font-family: var(--mono);
  }
  .tally li { display: flex; align-items: baseline; gap: .45rem; }
  .tally b {
    font-family: var(--display);
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .tally span {
    font-size: .66rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ========================================================== controls */
  .controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(14,16,23,.93);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--edge);
  }
  .controls-inner {
    max-width: var(--wrap);
    margin: 0 auto;
    padding: .7rem 1.5rem;
    display: flex;
    gap: .8rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 11rem; }
  .search-wrap::before {
    content: "/";
    position: absolute;
    left: .75rem; top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    color: var(--amber);
    pointer-events: none;
  }
  #search {
    width: 100%;
    font-family: var(--mono);
    font-size: .8rem;
    padding: .6rem .8rem .6rem 1.7rem;
    color: var(--bright);
    background: var(--chrome-2);
    border: 1px solid var(--edge);
    border-radius: 4px;
  }
  #search::placeholder { color: #5A6376; }
  #search:focus { border-color: var(--amber); outline: none; }

  .filters { display: flex; flex-wrap: wrap; gap: .3rem; }
  .filters button {
    font-family: var(--mono);
    font-size: .67rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: .5rem .7rem;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 4px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .filters button:hover { color: var(--bright); border-color: #3A4356; }
  .filters button[aria-pressed="true"] {
    background: var(--bright);
    border-color: var(--bright);
    color: var(--void);
  }
  .count {
    font-family: var(--mono);
    font-size: .67rem;
    letter-spacing: .08em;
    color: var(--dim);
    white-space: nowrap;
  }

  /* ============================================================ register */
  main {
    max-width: var(--wrap);
    margin: 0 auto;
    padding: 2.5rem 1.5rem 6rem;
  }

  .day {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 2.6rem 0 1.1rem;
    padding-left: var(--spine);
    position: relative;
  }
  .day:first-child { margin-top: 0; }
  .day::after {
    content: "";
    position: absolute;
    left: var(--spine); right: 0; bottom: -.45rem;
    height: 1px;
    background: var(--edge);
  }

  .entry {
    position: relative;
    padding-left: var(--spine);
    padding-bottom: 1.6rem;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) backwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
  }

  /* the spine: entries hang off the time they were filed */
  .entry::before {
    content: "";
    position: absolute;
    left: calc(var(--spine) - 2.05rem);
    top: .5rem; bottom: -.4rem;
    width: 1px;
    background: var(--edge);
  }
  .entry:last-child::before { bottom: auto; height: 1.6rem; }

  .node {
    position: absolute;
    left: 0; top: .1rem;
    /* stop short of the spine so the time never collides with the dot */
    width: calc(var(--spine) - 2.85rem);
    text-align: right;
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--dim);
    line-height: 1.5;
  }
  .node .time { display: block; color: var(--bright); }
  .node .no { display: block; font-size: .6rem; opacity: .6; }
  /* the node dot rides the spine itself, so it lines up at every width */
  .entry::after {
    content: "";
    position: absolute;
    left: calc(var(--spine) - 2.05rem);
    top: .52rem;
    width: 9px; height: 9px;
    margin-left: -5.5px;
    border-radius: 50%;
    background: var(--void);
    border: 2px solid var(--kind, var(--amber));
  }

  /* ---- the sheet: a light reading surface inside the dark console ---- */
  .sheet {
    background: var(--sheet);
    color: var(--ink);
    border-radius: 6px;
    padding: 1.6rem 1.75rem 1.4rem;
    box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 18px 40px -28px rgba(0,0,0,.9);
    border-top: 3px solid var(--kind, var(--amber));
  }

  .kind {
    display: inline-block;
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 .5rem;
  }
  .kind b { color: var(--kind-ink, var(--ink)); font-weight: 500; }

  .sheet h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(1.35rem, 3.2vw, 1.72rem);
    letter-spacing: -.025em;
    line-height: 1.16;
    margin: 0 0 .6rem;
    color: var(--ink);
  }
  .lede {
    margin: 0 0 1.1rem;
    font-size: 1.06rem;
    color: #2C323D;
  }

  /* ---- fields ---- */
  .field { margin: 1.1rem 0 0; }
  .field-label {
    font-family: var(--mono);
    font-size: .62rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 .3rem;
  }
  .field > .prose { margin: 0; }

  /* model text carries bare URLs and long identifiers; never let one of them
     push the sheet wider than the screen */
  .prose, .sheet h2 { overflow-wrap: anywhere; }
  .prose p { margin: 0 0 .7rem; }
  .prose p:last-child { margin-bottom: 0; }
  .prose h3, .prose h4 {
    font-family: var(--display);
    letter-spacing: -.015em;
    margin: 1.35rem 0 .45rem;
  }
  .prose h3 { font-size: 1.06rem; font-weight: 600; }
  .prose h4 { font-size: .95rem; font-weight: 600; color: #333B48; }
  .prose h3:first-child, .prose h4:first-child { margin-top: 0; }
  .prose ul, .prose ol { margin: .3rem 0 .8rem; padding-left: 1.25rem; }
  .prose li { margin: .28rem 0; }
  .prose ol { list-style: decimal; }
  .prose ul { list-style: none; padding-left: 1.1rem; }
  .prose ul > li { position: relative; }
  .prose ul > li::before {
    content: "";
    position: absolute;
    left: -.95rem; top: .62em;
    width: 5px; height: 1px;
    background: var(--kind, var(--amber));
  }
  .prose code {
    font-family: var(--mono);
    font-size: .84em;
    background: var(--sheet-2);
    border: 1px solid #E3E0D7;
    border-radius: 3px;
    padding: .08em .34em;
    word-break: break-word;
  }
  .prose strong { font-weight: 600; }
  .prose a { color: #1F5FA8; text-decoration: underline; text-underline-offset: 2px; }
  .prose a:hover { color: var(--ink); }

  /* ---- the fold: long notes stay short until asked ---- */
  .fold { position: relative; }
  .fold[data-open="false"] .prose {
    max-height: 11rem;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 62%, transparent);
    mask-image: linear-gradient(#000 62%, transparent);
  }
  .fold-btn {
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-bottom: 1px solid #CFCBC0;
    padding: .3rem 0;
    margin-top: .7rem;
    cursor: pointer;
  }
  .fold-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* ---- links ---- */
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin: 1.3rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid #E5E2D9;
  }
  .links a {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .04em;
    text-decoration: none;
    color: var(--ink);
    background: var(--sheet-2);
    border: 1px solid #E0DCD2;
    border-radius: 4px;
    padding: .38rem .65rem;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .links a:hover {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--sheet);
    transform: translateY(-1px);
  }

  /* ---- states ---- */
  .empty {
    padding-left: var(--spine);
    color: var(--dim);
    font-size: 1rem;
  }
  .empty code {
    font-family: var(--mono);
    font-size: .84em;
    background: var(--chrome-2);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: .1em .35em;
  }

  footer {
    max-width: var(--wrap);
    margin: 0 auto;
    padding: 1.6rem 1.5rem 3rem;
    border-top: 1px solid var(--edge);
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #55607A;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  /* ========================================================== responsive */
  @media (max-width: 40rem) {
    :root { --spine: 0rem; }
    body { font-size: 16px; }
    .console-inner { padding: 2rem 1.1rem 1.25rem; }
    .controls-inner { padding: .6rem 1.1rem; }
    main { padding: 1.75rem 1.1rem 4rem; }
    footer { padding: 1.4rem 1.1rem 2.5rem; }
    .entry { padding-left: 0; padding-bottom: 1.1rem; }
    .entry::before { display: none; }
    .node {
      position: static;
      width: auto;
      text-align: left;
      display: flex;
      gap: .5rem;
      margin-bottom: .4rem;
    }
    .node .time, .node .no { display: inline; }
    .entry::after {
      left: 0; top: .48rem;
      margin-left: 0;
    }
    .node { padding-left: 1.1rem; }
    .day, .empty { padding-left: 0; }
    .day::after { left: 0; }
    .sheet { padding: 1.25rem 1.15rem 1.1rem; border-radius: 5px; }
    .tally { gap: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="console">
  <div class="console-inner">
    <p class="status">
      <span class="pulse" id="pulse" aria-hidden="true"></span>
      <span>Intake live</span>
      <span class="sep">/</span>
      <span id="range">—</span>
      <span class="sep">/</span>
      <span id="updated">reading…</span>
    </p>
    <h1>The <em>Register</em></h1>
    <p class="standfirst">
      A bot reads what I send it — repos, papers, articles, videos — and files
      the useful part here. Nothing is written by hand.
    </p>
    <ul class="tally" id="tally"></ul>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <label for="search" class="visually-hidden" hidden>Search the register</label>
      <input id="search" type="search" placeholder="search titles, problems, takeaways…" autocomplete="off" />
    </div>
    <div class="filters" role="group" aria-label="Filter by kind">
      <button data-filter="all"   aria-pressed="true">All</button>
      <button data-filter="tool"  aria-pressed="false">Tools</button>
      <button data-filter="note"  aria-pressed="false">Notes</button>
      <button data-filter="learn" aria-pressed="false">Learning</button>
      <button data-filter="paper" aria-pressed="false">Papers</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<main id="register">
  <p class="empty">Reading the register…</p>
</main>

<footer>
  <span>Filed automatically · Telegram → JSON → here</span>
  <span id="total"></span>
</footer>

     whole thing stops parsing. -->
<script>
/* mdfmt — render the markdown an LLM writes into readable, safe HTML.
 *
 * Entries are model output, so the order here is load-bearing: escape the
 * whole string FIRST, then add markup. Nothing from the source can become a
 * tag, and the only hrefs produced come from safeUrl() in the page.
 *
 * Handles what the digest prompts actually emit: ## headings, - and 1.
 * lists, **bold**, *italic*, `code`, blank-line paragraphs, and the
 * @url:`label`<href> form the extractor writes for links.
 */
const MD_ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => MD_ESC[c]);
}

/* Inline markup, applied to already-escaped text. */
function mdInline(t) {
  // @url:`label`<href> and @url:`href` — written by the extractor.
  t = t.replace(/@url:`([^`]+)`&lt;([^&]+?)&gt;/g,
    (_, label, url) => mdLink(url, label));
  t = t.replace(/@url:`([^`]+)`/g, (_, url) => mdLink(url, url));
  // Bare URLs left in prose by the model.
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
    (m, pre, url) => pre + mdLink(url.replace(/[.,;:]+$/, ""), null));
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return t;
}

/* Build one link, dropping anything that is not http(s). Mirrors the page's
   safeUrl() so mdfmt is safe on its own if reused elsewhere. */
function mdLink(raw, label) {
  let parsed;
  try { parsed = new URL(String(raw).replace(/&amp;/g, "&")); } catch { return esc(label || raw); }
  if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return esc(label || raw);
  const text = label || parsed.hostname.replace(/^www\./, "") + parsed.pathname.replace(/\/$/, "");
  return `<a href="${esc(parsed.href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
}

function mdfmt(s) {
  // Models often write a whole numbered sequence on one line
  // ("1. Install ... 2. Configure ... 3. Run ..."). Break those apart so they
  // read as the steps they are, not as one wall of text. Only lines that
  // already start as a step are split, so prose containing "4. " is safe.
  const src = esc(s).replace(/\r\n?/g, "\n").split("\n").map(line => {
    const l = line.trim();
    if (!/^\d{1,2}[.)]\s/.test(l)) return line;
    return l.replace(/\s+(?=\d{1,2}[.)]\s)/g, "\n");
  }).join("\n");
  const out = [];
  let list = null;          // "ul" | "ol" | null
  let para = [];

  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const closePara = () => {
    if (para.length) { out.push(`<p>${mdInline(para.join(" "))}</p>`); para = []; }
  };

  for (const rawLine of src.split("\n")) {
    const line = rawLine.trim();

    if (!line) { closePara(); closeList(); continue; }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      closePara(); closeList();
      // Depth is relative: a note's own "# Title" is a section here, not a
      // page title, so everything shifts down to h3/h4.
      const tag = heading[1].length <= 2 ? "h3" : "h4";
      out.push(`<${tag}>${mdInline(heading[2].replace(/[:#]+$/, ""))}</${tag}>`);
      continue;
    }

    const bullet = line.match(/^[-*•]\s+(.*)$/);
    if (bullet) {
      closePara();
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${mdInline(bullet[1])}</li>`);
      continue;
    }

    const numbered = line.match(/^(\d+)[.)]\s+(.*)$/);
    if (numbered) {
      closePara();
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${mdInline(numbered[2])}</li>`);
      continue;
    }

    // A continuation line inside a list item belongs to that item.
    if (list) { out.push(out.pop().replace(/<\/li>$/, " " + mdInline(line) + "</li>")); continue; }

    para.push(line);
  }
  closePara();
  closeList();
  return out.join("");
}

/* Plain text, for previews and search. */
function mdText(s) {
  return String(s == null ? "" : s)
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/@url:`([^`]+)`(<[^>]+>)?/g, "$1")
    .replace(/[*`>]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

</script>

guous memory blocks, enabling efficient memory management and reducing waste. vLLM is an LLM serving system that implements PagedAttention to achieve high throughput and low memory usage.\n\n## How it works\n1. **KV Cache Partitioning**: The KV cache for each request is divided into fixed-size blocks (like memory pages).\n2. **Non-Contiguous Storage**: These blocks are stored in non-contiguous memory, allowing for flexible memory allocation.\n3. **Dynamic Block Allocation**: Blocks are allocated on demand, reducing the need for pre-allocating large contiguous memory spaces.\n4. **Block Tables**: Logical blocks are mapped to physical blocks using block tables, enabling efficient memory sharing and management.\n5. **PagedAttention Kernel**: The kernel processes attention operations using the logical blocks, accessing the KV cache as needed without pre-allocating large memory chunks.\n\n## What you can do with it\n- **Realistic**: Improve LLM serving throughput, reduce memory waste, and support complex decoding algorithms.\n- **Speculative**: Enable efficient memory sharing across multiple sequences and requests, and scale LLM services to handle large models and long sequences.\n\n## Key details & nuances\n- **Memory Management**: PagedAttention reduces internal and external fragmentation by using non-contiguous blocks.\n- **Block Size**: Block size affects both memory efficiency and performance. Larger blocks can reduce latency but increase fragmentation.\n- **Compatibility**: vLLM supports various LLMs like GPT, OPT, and LLaMA, including models exceeding single GPU memory capacity.\n- **Throughput**: vLLM achieves 2-4× higher throughput than existing systems like FasterTransformer and Orca.\n\n## Notable examples / tools\n- **vLLM**: An open-source LLM serving system built on PagedAttention.\n- **PagedAttention**: The core algorithm that enables efficient KV cache management.\n- **FasterTransformer and Orca**: State-of-the-art systems that vLLM outperforms in throughput.\n\n## How to go deeper\n1. **Read vLLM Documentation**: Explore the architecture and implementation details of vLLM.\n2. **Experiment with PagedAttention**: Try implementing PagedAttention in a small LLM serving system.\n3. **Compare Block Sizes**: Study the impact of different block sizes on memory efficiency and performance.\n4. **Evaluate Existing Systems**: Use benchmarks to compare memory usage and throughput of different LLM serving systems.\n5. **Explore Decoding Algorithms**: Investigate how different decoding algorithms (e.g., beam search, parallel sampling) interact with PagedAttention.\n\n## Open questions\n- How to automatically evaluate the effectiveness of memory management techniques in LLM serving?\n- What are the optimal block sizes for different LLM models and use cases?\n- How can PagedAttention be extended to support even more complex memory-sharing scenarios?\n- What are the trade-offs between memory efficiency and computational performance in PagedAttention-based systems?\n- How can PagedAttention be integrated into existing LLM serving frameworks without major overhauls?", "type": "paper", "links": {"github": "", "website": "", "article": "https://arxiv.org/pdf/2309.06180"}, "_added": "2026-08-02T22:35:37.591984+00:00"}, {"title": "Leetcode Companywise Interview Questions", "description": "A repository containing company-wise LeetCode interview questions categorized by recency (Last 30 Days, Last 3 Months, etc.) with attributes like Difficulty, Acceptance %, and Frequency % for easy filtering.", "problem": "This tool solves the problem of organizing and filtering LeetCode interview questions based on company, recency, and difficulty, making it easier for users to prepare for technical interviews by focusing on the most relevant and frequently asked questions.", "how this works": "1. Clone the repository to access the CSV files containing the questions. 2. Use a CSV editor (like Excel, Google Sheets, or OpenOffice Calc) to sort and filter the data based on attributes such as difficulty, acceptance rate, and frequency. 3. For contributions, set up a Java project, configure the Scraper.java file with your LeetCode credentials, and run the scraper to update the dataset. 4. Submit a pull request to share your updated data with the community.", "links": {"github": "https://github.com/snehasishroy/leetcode-companywise-interview-questions", "website": "https://snehasishroy.com/", "article": ""}, "_added": "2026-08-05T18:25:45.042044+00:00"}, {"title": "claude-skills", "description": "A collection of skills and tools built for Claude, an AI assistant developed by Anthropic, offering various functionalities to enhance productivity and automation.", "problem": "This repository addresses the need for a centralized hub of skills and tools for Claude, enabling users to easily access and utilize AI-driven capabilities for different tasks, thereby improving efficiency and reducing the learning curve for new users.", "how this works": "1. Visit the GitHub repository to explore the available skills and tools for Claude.\n2. Choose a skill that aligns with your needs, such as coding, writing, or data analysis.\n3. Follow the provided documentation or setup instructions to integrate the skill with your Claude instance.\n4. Use the skill within Claude to automate tasks or enhance productivity based on its specific functionality.", "links": {"github": "https://github.com/topics/claude-skills", "website": "", "article": ""}, "_added": "2026-08-05T18:43:16.605655+00:00"}, {"title": "Flask", "description": "Flask is a lightweight WSGI web application framework for Python, designed to make getting started quick and easy, with the ability to scale up to complex applications. It is a flexible framework that allows developers to choose their own tools and libraries, with a strong community providing many extensions for added functionality.", "problem": "Flask solves the problem of building web applications by providing a lightweight, easy-to-use framework that simplifies the development process. It reduces the complexity of setting up a web application and allows developers to focus on the core logic of their application without being tied to specific tools or project layouts.", "how this works": "1. Install Flask using pip: `pip install Flask`\n2. Create a Python file (e.g., app.py) and define a Flask application using the `Flask` class.\n3. Define routes using the `@app.route()` decorator to map URLs to functions.\n4. Run the application using the `flask run` command or by calling the `app.run()` method.\n5. Access the application in a web browser at the specified URL (e.g., http://127.0.0.1:5000/).", "links": {"github": "https://github.com/pallets/flask", "website": "https://flask.palletsprojects.com", "article": ""}, "_added": "2026-08-05T18:47:54.359569+00:00"}, {"title": "OmniRoute", "description": "OmniRoute is a free AI gateway that aggregates 291 AI providers, including 90+ free tiers, into one endpoint. It automatically routes requests to the most cost-effective and available provider, saving up to 95% tokens through compression and offering a zero-config setup for immediate use.", "problem": "Managing multiple AI providers with different free tiers, rate limits, and configurations is complex and time-consuming. OmniRoute solves this by consolidating all providers into one endpoint, eliminating the need for manual management and providing real-time analytics and auto-fallback capabilities to avoid service interruptions.", "how this works": "1. Install OmniRoute via npm or Docker. 2. Point your AI tool (e.g., Claude Code, Cursor, Cline) to the local endpoint (http://localhost:20128/v1). 3. Use the `auto` model to let OmniRoute select the optimal provider automatically. 4. Monitor usage and free token budgets through the dashboard (/dashboard/free-tiers). 5. Optionally, configure specific providers or use compression techniques (RTK + Caveman) to save tokens.", "links": {"github": "https://github.com/diegosouzapw/OmniRoute", "website": "https://omniroute.online", "article": ""}, "_added": "2026-08-07T08:15:00.040513+00:00"}, {"title": "Headroom", "description": "Headroom is a context compression layer for AI agents that reduces token usage by up to 95% for JSON data and 15-20% for coding agents. It compresses everything an AI agent reads before it reaches the LLM, including tool outputs, logs, RAG chunks, files, and conversation history, while preserving accuracy and enabling reversible compression.", "problem": "AI agents often face high token costs due to the large volume of data they process. Headroom solves this by compressing data before it reaches the LLM, reducing token usage and costs without sacrificing accuracy. It also supports reversible compression, allowing original data to be retrieved when needed.", "how this works": "Headroom operates through multiple modes: as a library for inline compression, a proxy for zero-code changes, or as an agent wrapper for seamless integration with popular coding agents. It uses a combination of SmartCrusher, CodeCompressor, and Kompress-v2-base models to compress data based on its type. The compressed data is stored locally, and the original data is cached for retrieval. Headroom also supports output token reduction, trimming unnecessary tokens from the model's responses to further reduce costs.", "links": {"github": "https://github.com/headroomlabs-ai/headroom", "website": "https://docs.headroomlabs.ai/docs", "article": "https://www.star-history.com/?repos=chopratejas%2Fheadroom&type=date&legend=top-left"}, "_added": "2026-08-07T08:15:26.626430+00:00"}, {"title": "task-observer", "description": "A self-improving meta-skill that identifies and enhances skills by observing work patterns, corrections, and gaps, enabling continuous learning and improvement of both existing and new skills.", "problem": "Skills created by users often remain static and do not adapt to new usage patterns. Task Observer solves this by automatically identifying skill gaps, suggesting improvements, and evolving alongside the user's workflow, making skill maintenance and development more efficient.", "how this works": "1. Install the skill by downloading the repo and placing SKILL.md and references/ folder in the correct location for your AI platform. 2. Use the skill in your AI sessions, allowing it to monitor your work for corrections, gaps, and blind spots. 3. Review the structured observation logs generated during each session, which include suggested improvements and cross-cutting principles. 4. Approve and apply updates to your skills, enabling continuous improvement without manual auditing.", "links": {"github": "https://github.com/rebelytics/one-skill-to-rule-them-all", "website": "https://www.rebelytics.com/task-observer/", "article": ""}, "_added": "2026-08-07T08:15:48.600710+00:00"}, {"title": "Strix", "description": "Strix is an open-source AI pentesting tool that automates the process of finding and fixing vulnerabilities in applications. It uses autonomous AI agents to perform reconnaissance, exploitation, and validation of security vulnerabilities, providing real exploit proofs-of-concept and actionable remediation guidance.", "problem": "Strix solves the problem of manual and time-consuming security testing by offering an automated, efficient, and accurate way to identify and validate vulnerabilities. It reduces the overhead of manual pentesting and eliminates false positives from static analysis tools, making it easier for developers and security teams to maintain secure applications.", "how this works": "1. Install Strix using the provided script: `curl -sSL https://strix.ai/install | bash`\n2. Configure your AI provider by setting environment variables like `STRIX_LLM` and `LLM_API_KEY`.\n3. Run a security assessment with the command: `strix --target ./app-directory`\n4. Strix will automatically pull the sandbox Docker image and perform a dynamic security scan, saving results to `strix_runs/<run-name>`.\n5. Use the `strix view` command to access a local dashboard for detailed findings and reports.\n6. For CI/CD integration, set up a GitHub Actions workflow to run Strix on pull requests.", "links": {"github": "https://github.com/usestrix/strix", "website": "https://strix.ai", "article": ""}, "_added": "2026-08-11T10:10:51.923174+00:00"}, {"title": "CRM", "description": "Comp AI CRM is an open source, CRM designed for AI agents. It is an agentic-first CRM where the agent keeps its notes and runs on its own deployment, schedule, and work queue. The agent decides what to look at next, books follow-ups, spends a research budget, and stops when the budget runs out. It ensures nothing about a person is guessed, and tools report what they observed, with a ledger pricing the evidence.", "problem": "Traditional CRMs are databases with forms and chat boxes that rely on humans to find and record information. This CRM solves the problem by making the AI agent the core of the CRM, automating tasks like research, follow-ups, and data collection. It eliminates the need for manual input and ensures accurate, evidence-based data recording.", "how this works": "1. Clone the repository and set up the environment with Bun and Docker.\n2. Configure the `.env` file with necessary credentials and settings.\n3. Run the development server and access the app at http://localhost:3000.\n4. The agent runs autonomously, using tools, skills, and schedules to process data and update records.\n5. Use the Agent tab on each contact, company, or deal to watch the agent work and interact with it.", "links": {"github": "https://github.com/trycompai/crm", "website": "https://trycrm.ai", "article": ""}, "_added": "2026-08-11T10:11:16.718214+00:00"}, {"title": "Muse Glimmer is now available", "description": "## TL;DR\n- Muse Glimmer is a 30B parameter multimodal model from Meta now available on Ollama.\n- It supports coding agents and personal assistants with local execution.\n- It offers controllable reasoning strength and improved performance on Apple Silicon.\n\n## What it is\nMuse Glimmer is a large-scale, open-source multimodal model developed by Meta's Superintelligence Labs. It is designed for complex tasks that require both text and image understanding, making it suitable for coding agents and personal assistants that operate locally on a user's machine.\n\n## How it works\n1. **Model Deployment**: Muse Glimmer is available via Ollama, a platform that allows users to run large models locally.\n2. **Model Launch**: Users can launch Muse Glimmer by running the command `ollama run muse-glimmer` or using a specific variant optimized for Apple Silicon (`ollama run muse-glimmer:30b-mlx`).\n3. **Integration with Tools**: Muse Glimmer can be integrated with existing coding agents like Claude Code, Pi, and personal assistants like OpenClaw and Hermes through Ollama's `ollama launch` command.\n4. **Multimodal Support**: The model supports image input and DFlash, enabling low-latency tool calling for tasks involving visual data.\n5. **Controllable Reasoning**: Users can adjust the reasoning strength (low, medium, high, xhigh) to balance speed and accuracy based on the task's complexity.\n\n## What you can do with it\n- **Realistic**: Power coding agents for tasks like code generation, debugging, and documentation, or run personal assistants for task management and information retrieval.\n- **Speculative**: Build advanced agentic systems that combine visual and textual reasoning for creative or complex workflows, such as designing apps from mockups or analyzing visual data.\n\n## Key details & nuances\n- **Local Execution**: Muse Glimmer runs locally, which enhances privacy and reduces dependency on cloud infrastructure.\n- **Performance on Apple Silicon**: The MLX engine provides faster performance on Apple Silicon devices, making it ideal for users with M1/M2 chips.\n- **Image Input**: The model can process and reason about images, enabling new applications in areas like design, analysis, and automation.\n- **Controllable Reasoning**: Adjusting reasoning strength allows users to optimize for speed or accuracy, depending on the task's needs.\n\n## Notable examples / tools\n- **Coding Agents**: Claude Code, Pi, Codex, OpenCode, Copilot.\n- **Personal Assistants**: OpenClaw, Hermes.\n- **Platform**: Ollama (with MLX engine support).\n- **Model Variants**: `muse-glimmer` and `muse-glimmer:30b-mlx` for Apple Silicon optimization.\n\n## How to go deeper\n1. **Install Ollama**: Download and install Ollama from its official website to access Muse Glimmer locally.\n2. **Run Muse Glimmer**: Use the command `ollama run muse-glimmer` to start the model and explore its capabilities.\n3. **Experiment with Reasoning Strength**: Try different reasoning levels (low, medium, high, xhigh) to see how they affect performance on coding and agentic tasks.\n4. **Build a Coding Agent**: Use `ollama launch pi --model muse-glimmer` to create a lightweight coding assistant and test its integration with Muse Glimmer.\n5. **Explore Multimodal Use Cases**: Test Muse Glimmer with image input to see how it handles tasks like analyzing screenshots or designing apps from mockups.\n\n## Open questions\n- How can we further optimize the performance of Muse Glimmer on Apple Silicon?\n- What are the best practices for integrating Muse Glimmer with existing coding and personal assistant frameworks?\n- How can we evaluate the effectiveness of controllable reasoning strength in different task types?\n- What new applications can emerge from combining Muse Glimmer's multimodal capabilities with other AI tools?", "links": {"github": "", "website": "", "article": ""}, "_added": "2026-08-11T20:37:07.441532+00:00"}, {"title": "Divyam Dawar AI Learning Resources", "description": "# Deep Dive: AI Learning Resources by Divyam Dawar\n\n## TL;DR\n- Divyam Dawar provides a curated AI learning roadmap with structured playlists and courses.\n- Resources span from foundational programming to advanced AI systems and operations.\n- The content is accessible, practical, and includes real-world applications and tools.\n\n## What it is\nDivyam Dawar's AI Learning Resources is a curated collection of learning materials, including YouTube playlists, blog posts, and courses, aimed at helping learners build a comprehensive understanding of AI technologies and their applications. It covers a wide range of topics from basic programming to advanced AI systems, with a focus on hands-on learning and real-world implementation.\n\n## How it Works\n1. **Structured Learning Path**: The resources are organized into playlists and courses that follow a logical progression from basics to advanced topics.\n2. **Practical Focus**: Each resource emphasizes practical skills and real-world applications, such as building AI projects, deploying models, and integrating AI into production systems.\n3. **Community Engagement**: Learners can engage with the content through WhatsApp and LinkedIn, ensuring access to updates and professional insights.\n4. **Diverse Topics**: The learning materials cover a broad spectrum, including Python, data analysis, machine learning, deep learning, generative AI, and AI operations.\n\n## What You Can Do With It\n### Realistic\n- **Build a Strong Foundation**: Learn Python, SQL, and data analysis tools to create data-driven applications.\n- **Develop AI Models**: Gain the skills to build and deploy machine learning and deep learning models.\n- **Create AI Projects**: Use project-focused playlists to turn theoretical knowledge into working applications.\n- **Integrate AI into Production**: Learn about LLM operations, deployment, and monitoring using tools like FastAPI and LiteLLM.\n\n### Speculative\n- **Design Agentic AI Systems**: Explore advanced concepts like AI agents and agentic workflows to build self-sustaining AI systems.\n- **Develop AI Security Frameworks**: Learn to implement guardrails and security measures for AI systems.\n- **Contribute to Open Source**: Engage with open-source RAG frameworks and contribute to AI development communities.\n\n## Key Details & Nuances\n- **Comprehensive Coverage**: The resources provide a broad overview of AI and related technologies, making it suitable for both beginners and advanced learners.\n- **Hands-On Learning**: Emphasis is placed on practical implementation, which helps learners grasp complex concepts through real-world examples.\n- **Community Support**: Access to WhatsApp and LinkedIn communities ensures learners can seek guidance, share progress, and stay updated with the latest developments.\n- **Diverse Learning Formats**: The mix of videos, blog posts, and courses caters to different learning styles and preferences.\n\n## Notable Examples / Tools\n- **YouTube Playlists**: Python Learning, Machine Learning, Generative AI, and more.\n- **Blog Posts**: \"Top 10 RAG Frameworks on GitHub\" and \"Tracing and Observability with Arize AI.\"\n- **Courses**: GCP Zero to Hero, Azure Zero to Hero, and AWS Zero to Hero.\n- **Tools**: FastAPI, LiteLLM, MeshAPI, Arize AI, and Loop Engineering frameworks.\n\n## How to Go Deeper\n1. **Start with the Python Playlist**: Build a strong foundation in Python, essential for AI development.\n2. **Explore Generative AI Resources**: Dive into the playlist on generative AI to understand LLM applications and RAG.\n3. **Build a Project**: Use the Practical AI Projects Playlist to apply your knowledge by creating a working application.\n4. **Learn About LLM Operations**: Study the LLM Operations (LLMOps) playlist to understand how to deploy and manage AI systems in production.\n5. **Engage with the Community**: Join the WhatsApp channel and LinkedIn profile to connect with other learners and professionals.\n\n## Open Questions\n- How can we ensure that the learning resources remain up-to-date with the latest advancements in AI?\n- What are the best practices for integrating AI into production systems using tools like FastAPI and LiteLLM?\n- How can we evaluate the effectiveness of agentic AI systems and ensure they operate reliably in real-world scenarios?\n- What are the most critical areas for AI security and guardrails, and how can they be implemented effectively?", "links": {"github": "", "website": "", "article": ""}, "_added": "2026-08-25T08:40:12.092921+00:00"}, {"title": "Frontend Roadmap for 50 LPA", "description": "## TL;DR\n- A 50 LPA frontend engineer must master JavaScript, React, and system-level concepts like performance and security.\n- The path is structured in three levels: foundation, intermediate, and expert.\n- Real-world projects and deep understanding of \"why\" are critical for success.\n\n## What it is\nThe \"Frontend Roadmap for 50 LPA\" is a structured learning path that outlines the skills and knowledge required to become a senior frontend developer earning 50 LPA (Lakhs Per Annum) in India. It breaks down the journey into three levels, each building on the previous, and emphasizes the importance of depth over breadth.\n\n## How it works\n1. **Level 1 – Basics**: Focus on HTML, CSS, JavaScript fundamentals, and tooling. This is the foundation for all future learning.\n2. **Level 2 – Intermediate**: Dive deeper into JavaScript, React, state management, and networking. This level differentiates between average and advanced developers.\n3. **Level 3 – Expert**: Master rendering, performance, build tools, security, and system design. This level is for problem solvers who understand trade-offs and architecture.\n\n## What you can do with it\n- **Realistic**: Build a strong foundation in frontend development, master React and modern JavaScript, and become a capable full-stack developer.\n- **Speculative**: Design scalable frontend systems, lead teams, and contribute to architectural decisions at the enterprise level.\n\n## Key details & nuances\n- **Level 1 is non-negotiable**: Skipping it leads to weak foundations and difficulty in grasping advanced concepts.\n- **Depth > breadth**: Understanding a few concepts deeply is more valuable than knowing many superficially.\n- **Real projects matter**: Building working examples is essential for interview readiness and portfolio strength.\n- **\"Why\" is more important than \"what\"**: Interviewers look for understanding of principles, not just syntax.\n\n## Notable examples / tools\n- **Tools**: Git, npm, Tailwind CSS, React Query, React Testing Library, Playwright.\n- **Frameworks**: React, Next.js, GraphQL, WebSockets.\n- **Concepts**: SSR, hydration, tree shaking, code splitting, performance budgets.\n\n## How to go deeper\n1. Build a simple portfolio site using HTML, CSS, and JavaScript.\n2. Create a React app with state management using Redux or Zustand.\n3. Implement a REST API client with Axios and handle error states.\n4. Explore React Query for managing server state and caching.\n5. Study performance metrics like LCP, CLS, and INP and implement improvements.\n\n## Open questions\n- How can one effectively balance depth and breadth in frontend development?\n- What are the best practices for teaching \"why\" in frontend interviews?\n- How can developers measure and improve frontend performance systematically?\n- What are the most common pitfalls in transitioning from intermediate to expert-level development?\n- How can a developer build a strong portfolio without real-world experience?", "links": {"github": "", "website": "", "article": ""}, "_added": "2026-09-02T06:33:50.708788+00:00"}, {"title": "500+ AI Agent Projects & Use Cases", "description": "A curated collection of 500+ AI agent projects, use cases, and working implementations across major frameworks like LangGraph, CrewAI, AutoGen, and Agno. It includes production examples, tutorials, and code for various industries such as Healthcare, Finance, Education, Cybersecurity, and more.", "problem": "This repository solves the problem of finding relevant AI agent projects and use cases, helping developers, researchers, teams, and students to explore, understand, and implement AI agents efficiently without the need for complex monorepo setups.", "how this works": "1. Clone the repository using `git clone https://github.com/ashishpatel26/500-AI-Agents-Projects.git`.\n2. Navigate to the `agents/` directory to find self-contained agents with their own `requirements.txt` and `.env.example` files.\n3. Run an agent by installing dependencies and configuring the `.env` file with your API keys.\n4. Explore industry-specific use cases and framework comparisons to choose the right tool for your project.\n5. Contribute by adding your own agent or improving existing implementations.", "links": {"github": "https://github.com/ashishpatel26/500-AI-Agents-Projects", "website": "https://ashishpatel26.github.io/500-AI-Agents-Projects/", "article": ""}, "_added": "2026-09-04T18:35:25.734934+00:00"}, {"title": "The Agency", "description": "The Agency is a collection of AI agents designed to assist with various tasks across different domains. Each agent specializes in a specific area, such as frontend development, backend architecture, AI engineering, and more. These agents are ready to be used in tools like Claude Code, Cursor, and others to enhance productivity and streamline workflows.", "problem": "The Agency solves the problem of having a one-size-fits-all AI assistant by providing specialized AI agents tailored for specific tasks. It makes life easier by allowing users to select and utilize agents that match their exact needs, improving efficiency and reducing the time spent on repetitive or complex tasks.", "how this works": "1. Install the native desktop app (Agency Agents) for macOS, Linux, and Windows to browse and install agents into supported tools.\n2. Alternatively, use the command-line scripts to install agents into tools like Claude Code, Cursor, and others.\n3. Each agent has a defined role, personality, and deliverables, allowing users to activate specific agents for their tasks.\n4. For multi-tool integrations, generate integration files and install agents into the desired tools using the provided scripts.", "links": {"github": "https://github.com/msitarzewski/agency-agents", "website": "", "article": ""}, "_added": "2026-09-05T08:04:55.373682+00:00"}, {"title": "AutoGPT", "description": "AutoGPT is an open-source platform for building, deploying, and running AI agents that automate complex workflows. Users can describe tasks in plain English, and AutoGPT creates agents that execute these tasks autonomously, offering a visual builder for precise control over workflows.", "problem": "AutoGPT solves the problem of complex task automation by allowing users to create AI agents without coding. It simplifies workflows, saves time, and reduces the need for manual intervention, making AI accessible even to non-technical users.", "how this works": "1. Use the AutoGPT Platform to describe tasks in plain English or use the visual builder for detailed workflow control.\n2. AutoGPT generates an AI agent that executes the described tasks.\n3. Run agents on demand, on schedules, or from triggers.\n4. For self-hosting, install the tool using the provided scripts and configure it with your infrastructure and model API keys.", "links": {"github": "https://github.com/Significant-Gravitas/AutoGPT", "website": "https://agpt.co", "article": ""}, "_added": "2026-09-05T13:33:24.395884+00:00"}, {"title": "Superpowers", "description": "Superpowers is a complete software development methodology for coding agents, built on top of a set of composable skills and initial instructions that guide agents to use them effectively. It emphasizes test-driven development, systematic debugging, and collaborative workflows to streamline the software development process.", "problem": "Superpowers solves the problem of inefficient and error-prone coding by providing a structured, automated approach to software development. It reduces the cognitive load on developers by handling repetitive tasks, ensuring code quality through testing and reviews, and enabling parallel development workflows, thus making the development process faster and more reliable.", "how this works": "1. Start by brainstorming and refining your ideas through questions and exploring alternatives. 2. Use git worktrees to create isolated workspaces for new branches. 3. Break down the work into small, manageable tasks with exact file paths and code. 4. Use subagent-driven development to execute tasks with two-stage reviews. 5. Implement with test-driven development (RED-GREEN-REFACTOR) to ensure code quality. 6. Request code reviews and address feedback. 7. Finish the development branch by verifying tests and deciding on merge options.", "links": {"github": "https://github.com/obra/superpowers", "website": "", "article": ""}, "_added": "2026-09-06T19:29:43.580166+00:00"}, {"title": "10/10 Engineer’s Resource Guide | Vishakha Sadhwani", "description": "## TL;DR\n- The 10/10 Engineer’s Resource Guide is a curated list of tools and learning resources for engineers.\n- It covers cloud computing, coding, system design, and project building.\n- It emphasizes hands-on practice and real-world project experience.\n\n## What it is\nThe 10/10 Engineer’s Resource Guide is a comprehensive, structured list of learning paths, tools, and project ideas aimed at helping software engineers and DevOps professionals enhance their skills and build practical experience. It is designed to help engineers achieve a 10/10 proficiency in various domains through targeted learning and project-based practice.\n\n## How it works\n1. **Cloud Learning Paths**: Provides structured learning paths on cloud platforms like AWS, Google Cloud, and others to build foundational and advanced skills.\n2. **Interactive Git Practice**: Offers hands-on Git practice tools to improve version control proficiency.\n3. **Networking, OS, DBMS, and System Design**: Includes cheat sheets, tutorials, and primers for core computer science and system design topics.\n4. **AI Coding Assistant Setup**: Guides users through setting up AI assistants like Claude, Codex, and Cursor to enhance coding productivity.\n5. **Open-Source Projects**: Lists notable open-source projects for learning and contributing to real-world codebases.\n6. **Cloud Projects**: Encourages building and publishing end-to-end cloud projects to gain practical experience in DevOps and cloud-native development.\n7. **Job Description Reverse Engineering**: Suggests using AI tools to analyze and understand high-paying job descriptions to align skills with market demands.\n\n## What you can do with it\n- **Realistic**: Build cloud projects, study open-source code, practice Git, and improve system design skills.\n- **Speculative**: Use AI tools to reverse-engineer job descriptions and tailor your learning path to high-demand roles.\n\n## Key details & nuances\n- The guide is highly practical and focused on real-world application.\n- It assumes a basic understanding of programming and computer science concepts.\n- The AI assistant setup is a key differentiator, enabling more efficient coding workflows.\n- While the guide is rich in resources, it is not a substitute for formal education or hands-on experience.\n\n## Notable examples / tools\n- **Cloud Learning Paths**: [kodekloud.com/learning-paths/](https://kodekloud.com/learning-paths/)\n- **Interactive Git Practice**: [ohmygit.org/](https://ohmygit.org/)\n- **Networking, OS, DBMS, System Design**: [Networking A to Z](https://networkinga2z.com/), [Operating Systems Cheat Sheet](https://oscheatsheet.com/), [DBMS Cheatsheet](https://dbmscheatsheet.com/), [SQL Cheatsheet](https://sqlcheatsheet.com/), [System Design Primer](https://systemdesignprimer.com/)\n- **AI Coding Assistant Setup**: [Claude Code Tutorial](https://www.claude.ai/), [Codex Tutorial](https://github.com/openai/codex), [Cursor Tutorial](https://cursor.sh/)\n- **Open-Source Projects**: [github.com/aws](https://github.com/aws), [opensource.google/projects](https://opensource.google/projects), [github.com/vllm-project](https://github.com/vllm-project)\n- **Cloud Projects**: [DevOps + AIOps COMPLETE Project](https://github.com/DevOps-AIOps), [5 RESUME PROJECTS For Cloud & DevOps Jobs](https://github.com/DevOps-Resume-Projects)\n\n## How to go deeper\n1. Start with the **Cloud Learning Paths** on [kodekloud.com](https://kodekloud.com/learning-paths/) to build a solid foundation.\n2. Practice Git using [ohmygit.org](https://ohmygit.org/) to improve version control skills.\n3. Study the **System Design Primer** and review the **Networking, OS, and DBMS Cheat Sheets** for core concepts.\n4. Set up an AI coding assistant like **Claude** or **Cursor** to streamline your coding workflow.\n5. Contribute to an open-source project from the list to gain real-world coding experience.\n\n## Open questions\n- How can we measure the effectiveness of AI-assisted coding in improving productivity?\n- What are the best practices for reverse-engineering job descriptions to align with market needs?\n- How can we ensure that the learning paths provided are up-to-date with industry trends?", "links": {"github": "", "website": "", "article": ""}, "_added": "2026-09-09T19:13:26.775466+00:00"}, {"title": "The-Complete-Guide-to-Building-Skill-for-Claude.pdf", "description": "# DEEP-DIVE: The Complete Guide to Building Skills for Claude\n\n## TL;DR\n- Skills are folders that teach Claude to handle specific workflows.\n- They improve consistency, reduce support overhead, and enable advanced automation.\n- Skills work with both standalone use and MCP integrations.\n- The guide covers planning, testing, distribution, and best practices.\n\n## What it is\nA **skill** is a folder containing instructions, scripts, and resources that teach Claude how to perform specific tasks or workflows. It's a way to customize Claude's behavior to align with your preferences, processes, or domain knowledge. Skills are particularly powerful for repeatable workflows, such as document creation, project management, and automation across multiple tools.\n\n## How it works\n1. **Define the skill's purpose**: Identify the task or workflow the skill will handle.\n2. **Create the skill folder**: Structure it with required files like `SKILL.md` and optional ones like `scripts/`, `references/`, and `assets/`.\n3. **Write the YAML frontmatter**: Define the skill's name, description, and metadata.\n4. **Write the main instructions**: Use Markdown to outline the workflow, examples, and troubleshooting.\n5. **Test the skill**: Use manual or automated testing to ensure it works as intended.\n6. **Deploy the skill**: Share it via Claude.ai, Claude Code, or an API for broader use.\n\n## What you can do with it\n### Realistic\n- **Document creation**: Generate consistent, high-quality documents, presentations, or code.\n- **Workflow automation**: Automate multi-step processes across tools like Linear, Notion, or GitHub.\n- **Support and onboarding**: Provide consistent guidance for new users or teams.\n- **Data analysis**: Process and analyze data from CSV, Figma, or other sources.\n\n### Speculative\n- **AI agents**: Build complex, autonomous agents that use skills to perform tasks without human intervention.\n- **Enterprise workflows**: Standardize and scale workflows across large organizations.\n- **Custom tools**: Integrate skills with proprietary tools to create domain-specific AI assistants.\n\n## Key details & nuances\n- **Skills are portable**: They work across Claude.ai, Claude Code, and the API, provided dependencies are met.\n- **Progressive disclosure**: Skills use a three-tier system to minimize token usage while maintaining expertise.\n- **MCP integration**: Skills can enhance MCP integrations by embedding workflows and best practices.\n- **Security**: Skills cannot contain XML tags or use reserved names like \"claude\" or \"anthropic\".\n- **Testing is critical**: Skills must be tested thoroughly to ensure they trigger and execute correctly in various scenarios.\n\n## Notable examples / tools\n- **skill-creator**: A tool that helps generate and refine skills from natural language.\n- **Linear**, **Notion**, **GitHub**: Common MCP services used with skills.\n- **LlamaIndex**, **LangChain**: Tools for building and managing skills, though not specific to Claude.\n- **ProjectHub**, **Sentry**, **PayFlow**: Real-world examples of skills used for specific workflows.\n\n## How to go deeper\n1. **Read the full guide**: Dive into the detailed sections on planning, testing, and distribution.\n2. **Try the skill-creator**: Use it to generate a skill for a simple workflow like document creation or project setup.\n3. **Build a small skill**: Start with a straightforward use case, like generating a report from a CSV file.\n4. **Test and iterate**: Run the skill in different scenarios to improve its accuracy and reliability.\n5. **Share your skill**: Upload it to Claude.ai or GitHub and see how others use it.\n\n## Open questions\n- **How to evaluate retrieval quality automatically?** (Relevant to RAG, but also relevant to skill performance.)\n- **How to measure skill success beyond user feedback?** (Quantitative metrics like API call counts and token usage.)\n- **How to handle edge cases in skill workflows?** (Improving error handling and validation.)\n- **How to scale skill usage across large teams or enterprises?** (Centralized management and version control.)\n- **How to ensure skills remain up-to-date with changing MCP tools or data sources?** (Automated updates and retraining.)", "type": "paper", "links": {"github": "", "website": "", "article": ""}, "_added": "2026-09-10T23:41:03.276349+00:00"}, {"description": "This article provides a collection of free resources and guides for AI workflow optimization, productivity, and self-improvement. It includes tools for cloning websites, automating job applications, building mobile apps, creating AI-powered chatbots, and enhancing coding practices through structured frameworks and templates.", "links": {"article": "https://www.aiburnerofficial.com/resources/"}, "takeAways": ["Use Ditto + GSAP to clone websites with motion effects and avoid common debugging traps.", "Implement Vibe Coding with structured context files to maintain project consistency and AI alignment.", "Automate job applications on Naukri using a Claude-in-Chrome prompt with built-in security guardrails.", "Follow step-by-step guides to publish Android apps on the Play Store, including setup and testing.", "Build a ride-hailing app (Zuber) or quick-commerce delivery app (Clinkit) using free blueprints and AI tools.", "Use Claude as an interview coach with customizable tracks, scored feedback, and study plans.", "Automate WhatsApp communication with an AI-powered script for customer support and sales.", "Leverage Stitch and Antigravity for design-to-development workflows with advanced settings and integration guides.", "Optimize AI image/video generation API usage with custom instructions to avoid unnecessary costs.", "Test React Native apps using Expo Go without needing Xcode or Android Studio."], "_added": "2026-08-07T08:14:29.873428+00:00", "title": "The Free AI Resource Vault"}];</script>
<script>
"use strict";

let DATA = [];
let FILTER = "all";

/* ------------------------------------------------------------ escaping */
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
}

/* Only http(s) links are ever rendered — entries are written by an LLM, so a
   javascript:/data: URL must never reach an href. Returns null if unusable. */
function safeUrl(u) {
  if (typeof u !== "string" || !u.trim()) return null;
  let t = u.trim();
  // unwrap @url:`display`<url> and @url:`url` leftovers written by the
  // extractor so they become real clickable links.
  const m1 = t.match(/^@url:`([^`]+)`<([^>]+)>$/);
  if (m1) t = m1[2];
  else { const m2 = t.match(/^@url:`([^`]+)`$/); if (m2) t = m2[1]; }
  let parsed;
  try { parsed = new URL(t); } catch { return null; }
  if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return null;
  return parsed;
}

function linkHTML(u, label) {
  const parsed = safeUrl(u);
  if (!parsed) return "";
  const text = label || parsed.hostname.replace(/^www\./, "");
  return `<a href="${esc(parsed.href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
}

/* -------------------------------------------------------------- shaping */
const KINDS = {
  tool:  { label: "Tool",     color: "var(--tool)",  ink: "#8A5A00" },
  note:  { label: "Note",     color: "var(--note)",  ink: "#1C5F79" },
  learn: { label: "Learning", color: "var(--learn)", ink: "#1F6B49" },
  paper: { label: "Paper",    color: "var(--paper)", ink: "#3D45AE" },
  doc:   { label: "Document", color: "var(--doc)",   ink: "#8E3D77" },
};

/* Classify by what an entry actually carries, not by the shape of `links` —
   the store normalizes every entry's links to a dict, so link shape no
   longer distinguishes anything. */
function kindOf(item) {
  if (!item) return "note";
  if (item.type === "paper") return "paper";
  if (item.type === "doc") return "doc";
  if (item.takeAways) return "learn";
  if (item.problem || item["how this works"]) return "tool";
  return "note";
}

function linksOf(item) {
  const L = item.links;
  if (typeof L === "string") return { article: L };
  return (L && typeof L === "object") ? L : {};
}

function accessionDate(item) {
  const d = new Date(item._added);
  return isNaN(d) ? null : d;
}

/* ------------------------------------------------------------ rendering */
function foldHTML(label, value, id) {
  const v = (value == null ? "" : String(value)).trim();
  if (v.length < 2) return "";
  const long = v.length > 520;
  const prose = `<div class="prose">${mdfmt(v)}</div>`;
  if (!long) {
    return `<div class="field"><p class="field-label">${esc(label)}</p>${prose}</div>`;
  }
  return `<div class="field fold" data-open="false">
    <p class="field-label">${esc(label)}</p>
    ${prose}
    <button class="fold-btn" data-fold="${esc(id)}" aria-expanded="false">Read the full note</button>
  </div>`;
}

/* Takeaways come through as an array; render them as the list they are. */
function takeawaysHTML(value) {
  const items = Array.isArray(value) ? value : String(value || "").split("\n");
  const li = items
    .map(t => String(t).trim())
    .filter(t => t.length > 1)
    .map(t => `<li>${mdInline(esc(t.replace(/^[-*•]\s*/, "")))}</li>`)
    .join("");
  if (!li) return "";
  return `<div class="field"><p class="field-label">Takeaways</p>
    <div class="prose"><ul>${li}</ul></div></div>`;
}

function entryHTML(entry) {
  const item = entry.item;
  const kind = kindOf(item);
  const meta = KINDS[kind];
  const L = linksOf(item);
  const parts = [];

  parts.push(`<p class="kind"><b>${esc(meta.label)}</b></p>`);

  const title = (item.title || "").trim();
  if (title) parts.push(`<h2>${esc(title)}</h2>`);

  const desc = (item.description || "").trim();
  if (kind === "tool") {
    // Tool cards carry a short description plus its own dedicated fields.
    if (desc) parts.push(`<div class="prose lede">${mdfmt(desc)}</div>`);
    parts.push(foldHTML("Problem it solves", item.problem, entry.no + "p"));
    parts.push(foldHTML("How it works", item["how this works"], entry.no + "h"));
  } else if (kind === "learn") {
    if (desc) parts.push(`<div class="prose lede">${mdfmt(desc)}</div>`);
    parts.push(takeawaysHTML(item.takeAways));
  } else {
    // Papers, documents and notes are one long written explanation.
    const label = kind === "paper" ? "The paper, explained"
                : kind === "doc" ? "Document summary"
                : "The note";
    parts.push(foldHTML(label, desc, entry.no + "d"));
  }

  const links = [
    linkHTML(L.github, "GitHub"),
    linkHTML(L.website, "Website"),
    linkHTML(L.article, kind === "paper" ? "Read the paper" : "Source"),
  ].filter(Boolean);
  if (links.length) parts.push(`<div class="links">${links.join("")}</div>`);

  const d = accessionDate(item);
  const time = d ? d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "--:--";

  return `<article class="entry" style="--kind:${meta.color};--kind-ink:${meta.ink};animation-delay:${Math.min(entry.i, 10) * 40}ms">
    <div class="node">
      <span class="time">${esc(time)}</span>
      <span class="no">No.${esc(String(entry.no).padStart(3, "0"))}</span>
    </div>
    <div class="sheet">${parts.filter(Boolean).join("")}</div>
  </article>`;
}

function dayLabel(d) {
  if (!d) return "Undated";
  return d.toLocaleDateString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const host = document.getElementById("register");

  const matches = DATA.filter(entry => {
    if (FILTER !== "all") {
      const k = kindOf(entry.item);
      // "Papers" covers uploaded documents too — same thing to a reader.
      const wanted = FILTER === "paper" ? (k === "paper" || k === "doc") : k === FILTER;
      if (!wanted) return false;
    }
    return !q || entry.haystack.includes(q);
  });

  document.getElementById("count").textContent =
    q || FILTER !== "all" ? `${matches.length} of ${DATA.length}` : `${DATA.length} entries`;

  if (!matches.length) {
    host.innerHTML = `<p class="empty">Nothing filed under that yet. Try a broader term, or clear the filter.</p>`;
    return;
  }

  // Group by the day it was filed — the register reads as a log, not a grid.
  const html = [];
  let day = null;
  matches.forEach((entry, i) => {
    const label = dayLabel(accessionDate(entry.item));
    if (label !== day) { day = label; html.push(`<h2 class="day">${esc(label)}</h2>`); }
    html.push(entryHTML({ ...entry, i }));
  });
  host.innerHTML = html.join("");
}

function setFilter(f) {
  FILTER = f;
  document.querySelectorAll(".filters button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.filter === f)));
  render();
}

function setSummary() {
  const dates = DATA.map(e => accessionDate(e.item)).filter(Boolean);
  if (dates.length) {
    const fmt = d => d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
    const first = fmt(dates[dates.length - 1]), last = fmt(dates[0]);
    document.getElementById("range").textContent =
      first === last ? first : `${first} – ${last}`;
  }

  const counts = {};
  DATA.forEach(e => {
    const k = kindOf(e.item);
    counts[k] = (counts[k] || 0) + 1;
  });
  document.getElementById("tally").innerHTML = Object.keys(KINDS)
    .filter(k => counts[k])
    .map(k => `<li style="color:${KINDS[k].color}"><b>${counts[k]}</b>` +
              `<span>${esc(KINDS[k].label)}${counts[k] > 1 ? "s" : ""}</span></li>`)
    .join("");

  document.getElementById("total").textContent = `${DATA.length} entries filed`;
}

function shape(raw) {
  if (!Array.isArray(raw)) return [];
  // Newest first; accession numbers count up so No.001 is the oldest entry.
  const sorted = raw.slice().sort(
    (a, b) => String(b._added || "").localeCompare(String(a._added || "")));
  return sorted.map((item, i) => ({
    item,
    no: sorted.length - i,
    haystack: (typeof mdText === "function"
      ? mdText(JSON.stringify(item)) : JSON.stringify(item)).toLowerCase(),
  }));
}

/* ------------------------------------------------------------- loading */
async function fetchData() {
  if (location.protocol === "file:") return undefined;   // fetch is blocked
  for (const path of ["../data/data.json", "data/data.json"]) {
    try {
      const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) continue;
      return await r.json();
    } catch { /* try the next path */ }
  }
  return undefined;
}

async function load() {
  let raw = await fetchData();
  if (raw === undefined) raw = window.REGISTER_DATA;
  if (raw === undefined) {
    document.getElementById("register").innerHTML =
      `<p class="empty">No data found. Run <code>python -m content_digest_bot.store</code>
       to generate the register, then reload.</p>`;
    return;
  }
  DATA = shape(raw);
  _seen = JSON.stringify(raw);
  setSummary();
  render();
}

function stampUpdated(isNew) {
  document.getElementById("updated").textContent =
    "checked " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  if (isNew) {
    const p = document.getElementById("pulse");
    p.classList.remove("hit");
    void p.offsetWidth;              // restart the animation
    p.classList.add("hit");
  }
}

// Keep the page live: re-pull every 15s so a new filing appears without a
// refresh. Only re-renders when the payload actually changed.
let _seen = "";
async function refresh() {
  const raw = await fetchData();
  if (raw === undefined) return;
  const sig = JSON.stringify(raw);
  if (sig === _seen) return;
  _seen = sig;
  DATA = shape(raw);
  setSummary();
  render();
  stampUpdated(true);
}

/* --------------------------------------------------------------- events */
document.getElementById("search").addEventListener("input", render);
document.querySelectorAll(".filters button").forEach(b =>
  b.addEventListener("click", () => setFilter(b.dataset.filter)));

// Unfold a long note in place.
document.getElementById("register").addEventListener("click", e => {
  const btn = e.target.closest(".fold-btn");
  if (!btn) return;
  const fold = btn.closest(".fold");
  const open = fold.dataset.open === "true";
  fold.dataset.open = String(!open);
  btn.setAttribute("aria-expanded", String(!open));
  btn.textContent = open ? "Read the full note" : "Show less";
});

// "/" focuses search, the way every log viewer does it.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "search") {
    e.preventDefault();
    document.getElementById("search").focus();
  }
});

load().then(() => stampUpdated(false));
setInterval(refresh, 15000);
</script>
</body>
</html>
